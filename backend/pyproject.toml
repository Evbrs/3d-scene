[project]
name = "renovation-plan-backend"
version = "0.1.0"
description = "Backend FastAPI de l'éditeur de plan de rénovation 2D → 3D"
requires-python = ">=3.12,<3.13"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    # ORM / migrations / admin (spec §6)
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "sqladmin>=0.20",
    "psycopg[binary]>=3.2",
    "itsdangerous>=2.2",
    # Tâches async (spec §6)
    "celery>=5.4",
    "redis>=5.2",
    # Calcul géométrique (spec §6)
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "factory-boy>=3.3",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "types-factory-boy>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- Qualité ------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = ["sqladmin.*", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
