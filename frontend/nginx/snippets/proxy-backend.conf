# Relais vers l'API FastAPI, inclus par chaque `location` qui parle au backend.

# Le nom d'hôte passe par une variable pour forcer une résolution DNS à chaque requête (voir la
# directive `resolver`). Avec un nom littéral, nginx le résout une seule fois au chargement de la
# configuration : il refuse de démarrer si le backend n'est pas encore là, et continue d'écrire
# vers l'ancienne adresse après un redémarrage du conteneur.
# `$request_uri` conserve le chemin et la chaîne de requête tels que reçus.
set $backend_upstream http://backend:8000;
proxy_pass $backend_upstream$request_uri;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
# Le schéma vu par le client, pas celui de ce saut-ci : sans lui, une redirection émise par
# FastAPI repartirait en http:// depuis une page https, et le navigateur la bloquerait.
proxy_set_header X-Forwarded-Proto $forwarded_proto;

# Écrasement, jamais concaténation. `$proxy_add_x_forwarded_for` conserverait l'en-tête envoyé
# par le client, qui pourrait alors se déclarer n'importe quelle adresse et vider le seau de
# quelqu'un d'autre chez les limiteurs de débit. `$remote_addr` est déjà l'adresse réelle,
# reconstituée par `real_ip` à partir du seul réseau de confiance.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;

proxy_connect_timeout 5s;
# Un export PDF direct est synchrone et peut dépasser la minute sur un plan chargé.
proxy_read_timeout 120s;
proxy_send_timeout 120s;
