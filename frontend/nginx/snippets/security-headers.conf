# En-têtes de sécurité des réponses HTML.
#
# À inclure dans CHAQUE bloc `location` qui sert du HTML. nginx n'hérite pas des `add_header` du
# niveau parent dès que le niveau courant en déclare un seul : c'est le défaut qui laissait
# toutes les pages de l'application sans CSP, alors que le bloc `server` en portait une.
#
# Ce fichier ne vit pas dans /etc/nginx/conf.d : tout `*.conf` y est inclus automatiquement dans
# le bloc `http`, et les en-têtes seraient posés en double.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;

# La CSP autorise les scripts et styles de l'application elle-même, et rien d'autre — pas de CDN,
# pas de script en ligne. `connect-src 'self'` n'est tenable que parce que l'API est relayée sur
# la même origine (voir default.conf.template) : avec une API sur un autre domaine, il faudrait
# rouvrir cette directive.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# N'a d'effet que derrière la bordure TLS ; un navigateur ignore un HSTS reçu en clair, donc
# l'en-tête est inoffensif quand la terminaison TLS est désactivée.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
