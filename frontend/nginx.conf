# Configuration de service du frontend en production.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Application monopage : toute route inconnue retombe sur index.html, sinon un
    # rafraîchissement sur /projets/12/plan donnerait un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers versionnés par empreinte peuvent être mis en cache indéfiniment ;
    # index.html ne le doit jamais, sinon un déploiement reste invisible.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Mêmes protections que côté API. La CSP autorise les scripts et styles de l'application
    # elle-même, et rien d'autre — pas de CDN, pas d'inline.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Les erreurs nginx ne doivent pas révéler la version du serveur.
    server_tokens off;
}
