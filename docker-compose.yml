name: renovation-plan

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      # Port hôte décalé par défaut : une installation PostgreSQL locale occupe très souvent
      # 5432, et elle gagne sur `localhost` face au mapping Docker — d'où des « role does not
      # exist » très trompeurs. Surchargeable via POSTGRES_HOST_PORT.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts exécutés une seule fois, à l'initialisation du volume.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    # Les migrations sont appliquées au démarrage : sans ça, une stack fraîchement montée sert
    # une API sur une base sans tables. En production ce sera une étape de déploiement distincte
    # (P12), pas un effet de bord du lancement de l'application.
    command: sh -c "alembic upgrade head && python -m app.cli seed-catalog && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      # Explicite : la valeur par défaut du code est « production », qui refuse de démarrer sans
      # SECRET_KEY forte. C'est voulu — voir app/core/config.py.
      SECRET_KEY: ${SECRET_KEY:-cle-de-developpement-a-remplacer-absolument-32+}
      EXPORT_DIR: /exports
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Le volume est partagé avec le worker : c'est lui qui écrit les PDF, le backend les sert.
      - exports:/exports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    # Worker Celery : c'est lui qui exécute les exports PDF (spec §7, phase P9). Il partage
    # l'image et le code du backend, mais tourne dans son propre processus — d'où un moteur de
    # base créé chez lui, jamais hérité d'un fork.
    build:
      context: ./backend
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      SECRET_KEY: ${SECRET_KEY:-cle-de-developpement-a-remplacer-absolument-32+}
      EXPORT_DIR: /exports
    volumes:
      - ./backend:/app
      - exports:/exports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      # Rend `docker compose up --wait` déterministe : sans ça, --wait n'attend que l'état
      # "running" du conteneur, pas que le serveur Vite écoute réellement.
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  exports:
