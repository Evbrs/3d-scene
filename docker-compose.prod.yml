# Surcouche de production, à appliquer par-dessus `docker-compose.yml` :
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Différences volontaires avec le développement :
#   - aucun port de base de données ni de Redis exposé sur l'hôte ;
#   - aucun montage du code source : l'image fait foi, pas le disque du serveur ;
#   - pas de rechargement à chaud, plusieurs workers ;
#   - frontend servi en statique par nginx, pas par Vite ;
#   - variables sensibles obligatoires — la substitution `${VAR:?message}` fait échouer le
#     démarrage plutôt que de retomber sur une valeur de développement.

services:
  db:
    ports: !override []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER est obligatoire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB est obligatoire}
    volumes: !override
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    ports: !override []
    restart: unless-stopped

  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # Toute valeur autre que « development » impose une SECRET_KEY forte (app/core/config.py).
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY est obligatoire en production}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS est obligatoire en production}
      EXPORT_DIR: /exports
      DEBUG: "false"
    volumes: !override
      - exports:/exports
    restart: unless-stopped

  worker:
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY est obligatoire en production}
      EXPORT_DIR: /exports
    volumes: !override
      - exports:/exports
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL est obligatoire en production}
    command: !reset null
    ports: !override
      - "${FRONTEND_HOST_PORT:-8080}:8080"
    volumes: !override []
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
